name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git archive --format=zip --prefix=brosearch-${VERSION}/ HEAD -o brosearch-${VERSION}.zip
          git archive --format=tar.gz --prefix=brosearch-${VERSION}/ HEAD -o brosearch-${VERSION}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            brosearch-*.zip
            brosearch-*.tar.gz
