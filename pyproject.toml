[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brosearch"
version = "0.1.0"
description = "Your browser + the web, as one unified search API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["brosearch*"]
